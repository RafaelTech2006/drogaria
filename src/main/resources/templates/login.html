<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
<div class="container">
    <h1 class="mt-5">Login de Acesso</h1>
    <div class="card mb-3">
        <form th:action="@{/login}" method="post" class="card-body">
            <div class="form-group">
                <label for="username">Usuário:</label>
                <input id="username" type="text" name="username" class="form-control" placeholder="usuário">
            </div>
            <div class="form-group">
                <label for="password">Senha:</label>
                <input id="password" type="password" name="password" class="form-control" placeholder="senha">
            </div>
            <button class="btn btn-primary mt-3" type="submit">Acessar</button>
        </form>
    </div>
</div>
</body>
</html>
